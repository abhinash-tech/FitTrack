name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-apk.yml'
      - 'pnpm-lock.yaml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: 4. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 5. Prepare Mobile Environment Variables
        run: |
          cat << 'EOF' > apps/mobile/.env
          EXPO_PUBLIC_SUPABASE_URL=https://qkunimzwrpvbsfnqkmsi.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdW5pbXp3cnB2YnNmbnFrbXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMTc4NDYsImV4cCI6MjEwMzg5Mzg0Nn0.QQkUO7H1qT3GH5zphRnUFyosfPp9ELOYJT5HTob_iuE
          EOF

      - name: 6. Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 7. Build Android APK with Gradle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://qkunimzwrpvbsfnqkmsi.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdW5pbXp3cnB2YnNmbnFrbXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMTc4NDYsImV4cCI6MjEwMzg5Mzg0Nn0.QQkUO7H1qT3GH5zphRnUFyosfPp9ELOYJT5HTob_iuE
        run: |
          cd apps/mobile/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload FitTrack APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v1.0.apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
